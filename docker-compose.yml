services:
  datalake:
    image: pgsty/silo:latest
    container_name: dvf-datalake
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - datalake_data:/data
    restart: unless-stopped

  warehouse:
    image: postgres:16
    container_name: dvf-warehouse
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    restart: unless-stopped

  airflow:
    build: .
    container_name: dvf-airflow
    command: standalone
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      S3_ENDPOINT: http://datalake:9000
      POSTGRES_HOST: warehouse
      POSTGRES_PORT: "5432"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/pipeline/src
      - ./dbt:/opt/pipeline/dbt
    depends_on:
      - datalake
      - warehouse
    restart: unless-stopped

volumes:
  datalake_data:
  warehouse_data: