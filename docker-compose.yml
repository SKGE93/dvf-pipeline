services:
  datalake:
    image: pgsty/silo:latest
    container_name: dvf-datalake
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - datalake_data:/data
    restart: unless-stopped

volumes:
  datalake_data: